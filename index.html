<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const question = document.getElementById("question");
const message = document.getElementById("message");
const popup = document.getElementById("popup");

let noCount = 0;

const questions = [
    "Please? 🥺",
    "Think again 😭",
    "Are you sure? 💔",
    "Really sure? 😢",
    "One more chance? ❤️",
    "Don't break my heart 😭",
    "Still no? 🥺",
    "Please say yes ❤️",
    "Last chance 😭",
    "Choose carefully 👀"
];

message.innerText = "";

noBtn.addEventListener("click", () => {

    noCount++;

    if(noCount <= questions.length){
        question.innerText = questions[noCount - 1];
    }

    let currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);

    yesBtn.style.fontSize = (currentSize + 3) + "px";
    yesBtn.style.padding =
        (15 + noCount * 2) + "px " +
        (30 + noCount * 4) + "px";

    // Start running after 4 clicks
    if(noCount >= 4 && noCount < 10){
        noBtn.addEventListener("mouseover", moveButton);
    }

    // After 10 clicks
    if(noCount >= 10){

        noBtn.removeEventListener("mouseover", moveButton);

        noBtn.style.position = "absolute";
        noBtn.style.left = "50%";
        noBtn.style.top = "15px";
        noBtn.style.transform = "translateX(-50%)";

        noBtn.style.background = "transparent";
        noBtn.style.border = "none";
        noBtn.style.boxShadow = "none";
        noBtn.style.fontSize = "20px";
        noBtn.style.fontWeight = "bold";

        question.innerText = "You can’t escape destiny ❤️";

        // Clicking NO triggers YES
        noBtn.onclick = () => {
            yesBtn.click();
        };
    }
});

function moveButton(){

    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 80);

    noBtn.style.position = "fixed";
    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
}

yesBtn.addEventListener("click", () => {
    popup.style.display = "flex";
});

</script>
